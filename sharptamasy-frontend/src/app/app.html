<p>Numero task: {{ tasks().length }}</p>

<ul>
  @for (task of tasks(); track task.id) {
    <li>
      <strong>{{ task.title }}</strong><br>
      {{ task.description }}<br>
      Type: {{ task.type }}<br>
      Status: {{ task.status }}<br>
      Assigned to: {{ task.assignedTo }}
    </li>
  } @empty {
    <li>No tasks found.</li>
  }
</ul>
