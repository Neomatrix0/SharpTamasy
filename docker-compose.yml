services:
  backend:
    build:
      context: ./SharpTamasy.Api
      dockerfile: Dockerfile
    container_name: sharptamasy-backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    build:
      context: ./sharptamasy-frontend
      dockerfile: Dockerfile
    container_name: sharptamasy-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend